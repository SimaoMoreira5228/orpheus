[package]
name = "orpheus-example-plugin"
version = "0.1.0"
edition = "2021"
description = "Example Orpheus plugin"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = { version = "0.53", default-features = true }

[profile.release]
opt-level = "s"
lto = true
