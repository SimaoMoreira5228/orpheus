[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]
resolver = "3"
members = [
	".",
	"control-api",
	"core",
	"plugins",
	"sdks/rust",
	"track-resolver",
]

[workspace.dependencies]
actix = "0.13"
actix-rt = "2"
actix-web = "4"
actix-web-actors = "4"
dashmap = "6"
futures-util = "0.3"
http = "1"
libytdlp = "0.6.0"
parking_lot = "0.13"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tracing = "0.1"

anyhow = "1"
orpheus-client-sdk = { path = "sdks/rust" }
orpheus-control-api = { path = "control-api" }
reqwest = { version = "0.13", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }

[package]
name = "orpheus"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "orpheus"
path = "src/main.rs"

[dependencies]
actix-rt.workspace = true
actix-web.workspace = true
anyhow.workspace = true
dotenvy = "0.15"
orpheus-control-api.workspace = true
orpheus-core = { path = "core" }
orpheus-plugins = { path = "plugins" }
orpheus-track-resolver = { path = "track-resolver" }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
orpheus-client-sdk.workspace = true
reqwest.workspace = true
serenity = { version = "0.12", default-features = false, features = [
	"client",
	"gateway",
	"model",
	"http",
	"rustls_backend",
] }

[[example]]
name = "discord-bot-rust"
path = "examples/discord-bot-rust.rs"
